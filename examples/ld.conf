# LambdaDelta configuration file
# SDU rotary switch: 0 for installation (SDU console on telnet port 3637),
# 1 for normal use (SDU console on the LambdaDelta window)
sdu_switch 1
ether_iface ldtap
ether_addr 00:02:9C:55:89:C6
# To run several emulators on one network, use "ether_addr laa" instead
# for a random locally administered address, saved in ldtap.LAA.
